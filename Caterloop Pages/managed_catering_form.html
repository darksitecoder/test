<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: #ffffff;
            width: 0%;
            transition: width 0.5s ease;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .question-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            width: 100%;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        .question-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .question-content {
            max-width: 700px;
            width: 100%;
        }

        .question-number {
            font-size: 13px;
            opacity: 0.5;
            margin-bottom: 16px;
            letter-spacing: 2px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 38px;
            font-weight: 600;
            margin-bottom: 50px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .mui-input {
            width: 100%;
            padding: 20px 24px;
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
            color: #ffffff;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .mui-input:focus {
            border-color: #ffffff;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.05);
        }

        .mui-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        textarea.mui-input {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.3;
            pointer-events: none;
        }

        .options-container {
            display: grid;
            gap: 16px;
        }

        .option-btn {
            padding: 24px 28px;
            font-size: 18px;
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.15);
            color: #ffffff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            position: relative;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: #ffffff;
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .option-btn:hover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            transform: translateX(8px);
        }

        .option-btn.selected {
            background: rgba(255,255,255,0.12);
            border-color: #ffffff;
        }

        .option-btn.selected::before {
            transform: scaleY(1);
        }

        .continue-btn {
            margin-top: 40px;
            padding: 18px 48px;
            font-size: 16px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .continue-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255,255,255,0.3);
        }

        .continue-btn:active {
            transform: translateY(-1px);
        }

        .completion-screen {
            min-height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .completion-screen.active {
            display: flex;
        }

        .completion-content {
            max-width: 600px;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            animation: scaleIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .checkmark .material-icons {
            font-size: 60px;
            color: #000000;
            animation: fadeIn 0.3s ease 0.4s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .completion-text {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .completion-subtext {
            font-size: 18px;
            opacity: 0.7;
            line-height: 1.6;
        }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            font-size: 18px;
        }

        .time-input-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .question-text {
                font-size: 28px;
            }

            .mui-input,
            .option-btn {
                font-size: 16px;
                padding: 18px 20px;
            }

            .time-input-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .helper-text {
            font-size: 14px;
            opacity: 0.5;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .helper-text .material-icons {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    
    <div class="questions-wrapper" id="questionsWrapper"></div>

    <div class="completion-screen" id="completionScreen">
        <div class="completion-content">
            <div class="checkmark">
                <span class="material-icons">check</span>
            </div>
            <div class="completion-text">Order Received!</div>
            <div class="completion-subtext">Thank you for your order. We'll prepare everything fresh and have it ready for you. You'll receive a confirmation email shortly.</div>
        </div>
    </div>

    <script>
        const questions = [
             { type: 'date', question: 'When would you like to visit us?', helper: 'Select a date from tomorrow onwards' },
              { 
                type: 'options', 
                question: 'Type of Service',
                options: ['Hors d oeuves / appetizers', 'Shared meal treys', 'Individual meal boxes', 'Others']
            },
            { type: 'text', question: 'How many people are looking to provide catering for ?', placeholder: 'Number of guests', icon: 'group' },
           { 
                type: 'options', 
                question: 'Budget',
                options: ['I have a per person budget', 'I have total budget']
            },
            { type: 'text', question: 'What is your total catering budget ?', placeholder: 'Enter Your budget', icon: 'money' },


            
            { type: 'text', question: 'What\'s your name?', placeholder: 'Enter your full name', icon: 'person' },  
            { type: 'email', question: 'What\'s your email address?', placeholder: 'name@example.com', icon: 'email' },
            { type: 'tel', question: 'What\'s your phone number?', placeholder: '+1 (555) 000-0000', icon: 'phone' },
            { 
                type: 'options', 
                question: 'Is this for dine-in or takeaway?',
                options: ['Dine-in', 'Takeaway', 'Delivery', 'Curbside Pickup', 'Reserve Table']
            },
           
            { type: 'time', question: 'What time works best for you?', helper: 'We\'re open from 11:00 AM to 11:00 PM' },
           
            { 
                type: 'options', 
                question: 'What type of cuisine are you interested in?',
                options: ['Italian', 'Chinese', 'Indian', 'Mexican', 'Continental']
            },
            { 
                type: 'options', 
                question: 'Any dietary preferences?',
                options: ['No Preference', 'Vegetarian', 'Vegan', 'Gluten-Free', 'Halal']
            },
            
            { type: 'text', question: 'Do you have a special occasion?', placeholder: 'Birthday, Anniversary, etc.', icon: 'celebration' },
            { 
                type: 'options', 
                question: 'Would you like to pre-order appetizers?',
                options: ['Yes, please', 'I\'ll order at the restaurant', 'No, thank you', 'Need recommendations', 'Surprise me']
            },
            { 
                type: 'options', 
                question: 'Preferred beverage type?',
                options: ['Soft Drinks', 'Wine', 'Beer', 'Cocktails', 'Non-Alcoholic']
            },
            { type: 'text', question: 'Any specific dishes you\'d like to try?', placeholder: 'Let us know your preferences', icon: 'restaurant_menu' },
            { 
                type: 'options', 
                question: 'Spice level preference?',
                options: ['Mild', 'Medium', 'Hot', 'Extra Hot', 'No Spice']
            },
            { type: 'textarea', question: 'Any food allergies or restrictions we should know about?', placeholder: 'Please list any allergies or dietary restrictions...' },
            { 
                type: 'options', 
                question: 'Would you like a dessert recommendation?',
                options: ['Yes, something sweet', 'Yes, something light', 'Chocolate based', 'Fruit based', 'No dessert']
            },
            { 
                type: 'options', 
                question: 'How did you hear about us?',
                options: ['Social Media', 'Google Search', 'Friend Recommendation', 'Food Blog', 'Walking By']
            },
            { 
                type: 'options', 
                question: 'Is this your first visit?',
                options: ['Yes, first time', 'Second visit', 'Regular customer', 'Special occasion return', 'Been here many times']
            },
            { type: 'text', question: 'Do you have any discount or promo code?', placeholder: 'Enter code if available', icon: 'local_offer' },
            { 
                type: 'options', 
                question: 'Preferred music ambiance?',
                options: ['Jazz', 'Classical', 'Pop', 'Quiet/Minimal', 'Live Performance']
            },
            { type: 'text', question: 'Any special table decorations needed?', placeholder: 'Flowers, candles, etc.', icon: 'emoji_nature' },
           
            { type: 'textarea', question: 'Any special requests for the chef?', placeholder: 'Special preparations, extra ingredients, etc...' },
            { 
                type: 'options', 
                question: 'Preferred payment method?',
                options: ['Credit/Debit Card', 'Cash', 'Digital Wallet', 'Split Bill', 'Corporate Account']
            },
            { type: 'text', question: 'Would you like valet parking?', placeholder: 'Yes or No', icon: 'local_parking' },
            { 
                type: 'options', 
                question: 'Join our loyalty program?',
                options: ['Yes, sign me up', 'Already a member', 'Tell me more', 'Maybe next time', 'No, thank you']
            },
            { type: 'textarea', question: 'Any additional comments or special arrangements?', placeholder: 'Anything else we should know to make your experience perfect...' },
            { 
                type: 'options', 
                question: 'Would you like to receive updates and offers?',
                options: ['Yes, all updates', 'Only special offers', 'Monthly newsletter', 'Event invitations only', 'No, thank you']
            }
        ];

        const answers = {};
        let currentQuestion = 0;

        function getTomorrowDate() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            return tomorrow.toISOString().split('T')[0];
        }

        function initQuestions() {
            const wrapper = document.getElementById('questionsWrapper');
            
            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';
                container.id = `question-${index}`;
                
                let inputHTML = '';
                
                if (q.type === 'options') {
                    inputHTML = `
                        <div class="options-container">
                            ${q.options.map((opt, i) => `
                                <button class="option-btn" data-value="${opt}" onclick="selectOption(${index}, ${i}, '${opt.replace(/'/g, "\\'")}')">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else if (q.type === 'date') {
                    inputHTML = `
                        <div class="input-wrapper">
                            <input type="date" class="mui-input" id="input-${index}" min="${getTomorrowDate()}" 
                                   onchange="handleInput(${index})" />
                            ${q.helper ? `<div class="helper-text"><span class="material-icons">info</span>${q.helper}</div>` : ''}
                        </div>
                    `;
                } else if (q.type === 'time') {
                    inputHTML = `
                        <div class="input-wrapper">
                            <input type="time" class="mui-input" id="input-${index}" 
                                   onchange="handleInput(${index})" />
                            ${q.helper ? `<div class="helper-text"><span class="material-icons">info</span>${q.helper}</div>` : ''}
                        </div>
                    `;
                } else if (q.type === 'textarea') {
                    inputHTML = `
                        <div class="input-wrapper">
                            <textarea class="mui-input" id="input-${index}" placeholder="${q.placeholder}" 
                                      oninput="handleInput(${index})"></textarea>
                        </div>
                    `;
                } else {
                    inputHTML = `
                        <div class="input-wrapper">
                            <input type="${q.type}" class="mui-input" id="input-${index}" placeholder="${q.placeholder}" 
                                   oninput="handleInput(${index})" />
                            ${q.icon ? `<span class="material-icons input-icon">${q.icon}</span>` : ''}
                        </div>
                    `;
                }
                
                container.innerHTML = `
                    <div class="question-content">
                        <div class="question-number">Question ${index + 1} → ${questions.length}</div>
                        <div class="question-text">${q.question}</div>
                        ${inputHTML}
                        ${q.type !== 'options' ? `<button class="continue-btn" id="continue-${index}" onclick="nextQuestion()">
                            Continue
                            <span class="material-icons">arrow_downward</span>
                        </button>` : ''}
                    </div>
                `;
                
                wrapper.appendChild(container);
            });
            
            showQuestion(0);
        }

        function showQuestion(index) {
            const allQuestions = document.querySelectorAll('.question-container');
            allQuestions.forEach(q => q.classList.remove('active'));
            
            setTimeout(() => {
                document.getElementById(`question-${index}`).classList.add('active');
                document.getElementById(`question-${index}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
            
            updateProgress();
        }

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function handleInput(index) {
            const input = document.getElementById(`input-${index}`);
            const continueBtn = document.getElementById(`continue-${index}`);
            
            if (input.value.trim() !== '') {
                continueBtn.classList.add('visible');
                answers[index] = input.value;
                
                if (input.type === 'date' || input.type === 'time') {
                    setTimeout(() => nextQuestion(), 600);
                }
            } else {
                continueBtn.classList.remove('visible');
            }
        }

        function selectOption(questionIndex, optionIndex, value) {
            const buttons = document.querySelectorAll(`#question-${questionIndex} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            buttons[optionIndex].classList.add('selected');
            
            answers[questionIndex] = value;
            
            setTimeout(() => nextQuestion(), 600);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
            } else {
                completeQuestionnaire();
            }
        }

        function completeQuestionnaire() {
            document.getElementById('questionsWrapper').style.display = 'none';
            document.getElementById('completionScreen').classList.add('active');
            document.getElementById('progressBar').style.width = '100%';
            
            console.log('Restaurant Order Details:', answers);
        }

        initQuestions();
    </script>
</body>
</html>
