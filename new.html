<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Order Form</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Inter', sans-serif;
  background: #000;
  color: #fff;
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* PROGRESS BAR */
.progress-bar-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: rgba(255,255,255,0.08);
  height: 5px;
  z-index: 1000;
}
.progress-bar {
  height: 5px;
  background: linear-gradient(90deg, #fff, #888);
  width: 0%;
  box-shadow: 0 0 20px rgba(255,255,255,0.4);
  transition: width 0.3s ease;
}

/* QUESTION WRAPPER */
.question-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.question-container.active {
  opacity: 1;
  transform: translateY(0);
}
.question-content {
  width: 100%;
  max-width: 700px;
}
.question-number {
  font-size: 14px;
  opacity: 0.6;
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.question-text {
  font-size: 36px;
  font-weight: 600;
  margin-bottom: 40px;
  line-height: 1.3;
  letter-spacing: -0.3px;
}

/* INPUT FIELDS */
.input-wrapper {
  position: relative;
  margin-bottom: 20px;
}
.mui-input {
  width: 100%;
  padding: 20px 24px;
  font-size: 18px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #fff;
  border-radius: 12px;
  outline: none;
  transition: all 0.3s ease;
}
.mui-input:focus {
  border-color: #fff;
  background: rgba(255,255,255,0.12);
  box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
}
.mui-input::placeholder {
  color: rgba(255,255,255,0.5);
}
textarea.mui-input {
  min-height: 120px;
  resize: vertical;
}

/* OPTIONS */
.options-container {
  display: grid;
  gap: 16px;
}
.option-btn {
  padding: 20px 24px;
  font-size: 18px;
  background: rgba(255,255,255,0.03);
  border: 2px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: left;
  font-weight: 500;
  position: relative;
}
.option-btn:hover {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.12);
  transform: translateX(6px);
}
.option-btn.selected {
  border-color: #fff;
  background: rgba(255,255,255,0.15);
}

/* CONTINUE BUTTON */
.continue-btn {
  margin-top: 30px;
  padding: 16px 40px;
  font-size: 16px;
  background: #fff;
  color: #000;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
  opacity: 0;
  pointer-events: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}
.continue-btn.visible {
  opacity: 1;
  pointer-events: auto;
}
.continue-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(255,255,255,0.3);
}

/* COMPLETION SCREEN */
.completion-screen {
  display: none;
  min-height: 100vh;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
}
.completion-screen.active {
  display: flex;
}
.completion-content {
  max-width: 600px;
}
.checkmark {
  width: 90px;
  height: 90px;
  background: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 30px;
}
.checkmark .material-icons {
  color: #000;
  font-size: 58px;
}
.completion-text {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 10px;
}
.completion-subtext {
  font-size: 18px;
  opacity: 0.8;
  line-height: 1.6;
}

/* RESPONSIVENESS */
@media (max-width: 1024px) {
  .question-text { font-size: 30px; }
  .mui-input, .option-btn { font-size: 16px; padding: 16px 20px; }
}
@media (max-width: 768px) {
  .question-text { font-size: 26px; }
  .progress-bar-container { height: 4px; }
  .mui-input, .option-btn { font-size: 15px; padding: 14px 18px; }
  .continue-btn { width: 100%; justify-content: center; }
}
@media (max-width: 480px) {
  .question-text { font-size: 22px; }
  .mui-input, .option-btn { font-size: 14px; }
  .checkmark { width: 70px; height: 70px; }
  .checkmark .material-icons { font-size: 48px; }
}
</style>
</head>
<body>
<div class="progress-bar-container">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div id="questionsWrapper"></div>

<div class="completion-screen" id="completionScreen">
  <div class="completion-content">
    <div class="checkmark">
      <span class="material-icons">check</span>
    </div>
    <div class="completion-text">Order Received!</div>
    <div class="completion-subtext">
      Thank you for your order! We'll prepare everything fresh and confirm shortly.
    </div>
  </div>
</div>

    <script>
        const questions = [
            { type: 'text', question: 'What\'s your name?', placeholder: 'Enter your full name', icon: 'person' },
            { type: 'email', question: 'What\'s your email address?', placeholder: 'name@example.com', icon: 'email' },
            { type: 'tel', question: 'What\'s your phone number?', placeholder: '+1 (555) 000-0000', icon: 'phone' },
            { 
                type: 'options', 
                question: 'Is this for dine-in or takeaway?',
                options: ['Dine-in', 'Takeaway', 'Delivery', 'Curbside Pickup', 'Reserve Table']
            },
            { type: 'date', question: 'When would you like to visit us?', helper: 'Select a date from tomorrow onwards' },
            { type: 'time', question: 'What time works best for you?', helper: 'We\'re open from 11:00 AM to 11:00 PM' },
            { type: 'text', question: 'How many people will be joining?', placeholder: 'Number of guests', icon: 'group' },
            { 
                type: 'options', 
                question: 'What type of cuisine are you interested in?',
                options: ['Italian', 'Chinese', 'Indian', 'Mexican', 'Continental']
            },
            { 
                type: 'options', 
                question: 'Any dietary preferences?',
                options: ['No Preference', 'Vegetarian', 'Vegan', 'Gluten-Free', 'Halal']
            },
            { 
                type: 'options', 
                question: 'What\'s your preferred seating?',
                options: ['Indoor', 'Outdoor Patio', 'Bar Area', 'Private Room', 'Window Side']
            },
            { type: 'text', question: 'Do you have a special occasion?', placeholder: 'Birthday, Anniversary, etc.', icon: 'celebration' },
            { 
                type: 'options', 
                question: 'Would you like to pre-order appetizers?',
                options: ['Yes, please', 'I\'ll order at the restaurant', 'No, thank you', 'Need recommendations', 'Surprise me']
            },
            { 
                type: 'options', 
                question: 'Preferred beverage type?',
                options: ['Soft Drinks', 'Wine', 'Beer', 'Cocktails', 'Non-Alcoholic']
            },
            { type: 'text', question: 'Any specific dishes you\'d like to try?', placeholder: 'Let us know your preferences', icon: 'restaurant_menu' },
            { 
                type: 'options', 
                question: 'Spice level preference?',
                options: ['Mild', 'Medium', 'Hot', 'Extra Hot', 'No Spice']
            },
            { type: 'textarea', question: 'Any food allergies or restrictions we should know about?', placeholder: 'Please list any allergies or dietary restrictions...' },
            { 
                type: 'options', 
                question: 'Would you like a dessert recommendation?',
                options: ['Yes, something sweet', 'Yes, something light', 'Chocolate based', 'Fruit based', 'No dessert']
            },
            { type: 'text', question: 'Preferred chef\'s specialty?', placeholder: 'Enter chef name or specialty', icon: 'chef_hat' },
            { 
                type: 'options', 
                question: 'How did you hear about us?',
                options: ['Social Media', 'Google Search', 'Friend Recommendation', 'Food Blog', 'Walking By']
            },
            { 
                type: 'options', 
                question: 'Is this your first visit?',
                options: ['Yes, first time', 'Second visit', 'Regular customer', 'Special occasion return', 'Been here many times']
            },
            { type: 'text', question: 'Do you have any discount or promo code?', placeholder: 'Enter code if available', icon: 'local_offer' },
            { 
                type: 'options', 
                question: 'Preferred music ambiance?',
                options: ['Jazz', 'Classical', 'Pop', 'Quiet/Minimal', 'Live Performance']
            },
            { type: 'text', question: 'Any special table decorations needed?', placeholder: 'Flowers, candles, etc.', icon: 'emoji_nature' },
            { 
                type: 'options', 
                question: 'Would you like a window with a view?',
                options: ['Yes, if available', 'Yes, willing to wait', 'No preference', 'Indoor preferred', 'Surprise me']
            },
            { type: 'textarea', question: 'Any special requests for the chef?', placeholder: 'Special preparations, extra ingredients, etc...' },
            { 
                type: 'options', 
                question: 'Preferred payment method?',
                options: ['Credit/Debit Card', 'Cash', 'Digital Wallet', 'Split Bill', 'Corporate Account']
            },
            { type: 'text', question: 'Would you like valet parking?', placeholder: 'Yes or No', icon: 'local_parking' },
            { 
                type: 'options', 
                question: 'Join our loyalty program?',
                options: ['Yes, sign me up', 'Already a member', 'Tell me more', 'Maybe next time', 'No, thank you']
            },
            { type: 'textarea', question: 'Any additional comments or special arrangements?', placeholder: 'Anything else we should know to make your experience perfect...' },
            { 
                type: 'options', 
                question: 'Would you like to receive updates and offers?',
                options: ['Yes, all updates', 'Only special offers', 'Monthly newsletter', 'Event invitations only', 'No, thank you']
            }
        ];

       
const answers = {};
let currentQuestion = 0;

function getTomorrow() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toISOString().split('T')[0];
}

function initQuestions() {
  const wrapper = document.getElementById('questionsWrapper');
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'question-container';
    div.id = `question-${i}`;

    let inputHTML = '';
    if (q.type === 'options') {
      inputHTML = `<div class="options-container">${q.options.map((opt, j) =>
        `<button class="option-btn" data-value="${opt}" onclick="selectOption(${i}, '${opt}')">${opt}</button>`
      ).join('')}</div>`;
    } else {
      const inputType = q.type === 'textarea' ? 'textarea' : 'input';
      if (q.type === 'date')
        inputHTML = `<input type="date" class="mui-input" id="input-${i}" min="${getTomorrow()}" onchange="handleInput(${i})">`;
      else if (q.type === 'time')
        inputHTML = `<input type="time" class="mui-input" id="input-${i}" onchange="handleInput(${i})">`;
      else
        inputHTML = `<input type="${q.type}" class="mui-input" id="input-${i}" placeholder="${q.placeholder || ''}" oninput="handleInput(${i})">`;
    }

    div.innerHTML = `
      <div class="question-content">
        <div class="question-number">Question ${i + 1} of ${questions.length}</div>
        <div class="question-text">${q.question}</div>
        <div class="input-wrapper">${inputHTML}</div>
        ${q.type !== 'options' ? `<button class="continue-btn" id="continue-${i}" onclick="nextQuestion()">Continue <span class="material-icons">arrow_downward</span></button>` : ''}
      </div>`;
    wrapper.appendChild(div);
  });
  showQuestion(0);
}

function showQuestion(index) {
  document.querySelectorAll('.question-container').forEach(q => q.classList.remove('active'));
  const q = document.getElementById(`question-${index}`);
  q.classList.add('active');
  q.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
}

function handleInput(i) {
  const input = document.getElementById(`input-${i}`);
  const btn = document.getElementById(`continue-${i}`);
  if (input.value.trim()) {
    btn.classList.add('visible');
    answers[i] = input.value;
  } else {
    btn.classList.remove('visible');
  }
}

function selectOption(i, value) {
  const opts = document.querySelectorAll(`#question-${i} .option-btn`);
  opts.forEach(o => o.classList.remove('selected'));
  event.target.classList.add('selected');
  answers[i] = value;
  setTimeout(nextQuestion, 400);
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    showQuestion(currentQuestion);
  } else completeForm();
}

function updateProgress() {
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
}

function completeForm() {
  document.getElementById('questionsWrapper').style.display = 'none';
  document.getElementById('completionScreen').classList.add('active');
  document.getElementById('progressBar').style.width = '100%';
  console.log('Collected answers:', answers);
}

initQuestions();
</script>
</body>
</html>
